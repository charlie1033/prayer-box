<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6B417">
<title>代禱信箱｜耶YEAH!市集 ReNEW!</title>
<meta name="description" content="寫下你想被代禱的事，我們會為你禱告。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============ 顏色取自主題圖 ============ */
:root{
  --ink:#232022;        /* ReNEW! 的黑字 */
  --sun:#F6B417;        /* 太陽黃 */
  --sun-soft:#FFE7A3;
  --cream:#FFFBF0;
  --pink:#F48FAA;
  --blue:#5DAAF0;
  --navy:#1F3C78;
  --teal:#27A397;
  --red:#E8463C;
  --line:2.5px solid var(--ink);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Chiron GoRound TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:#F7D27E url("img/bg.jpg") center top / cover fixed;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  line-height:1.6;
}
/* iOS 不支援 fixed 背景，改用偽元素固定 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:#F7D27E url("img/bg.jpg") center top / cover no-repeat;
}

/* ============ 橫幅 ============ */
.hero{position:relative;max-width:560px;margin:0 auto;padding:14px 16px 0}
.hero img{display:block;width:100%;height:auto;border:var(--line);border-radius:var(--radius);box-shadow:none}

.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}

/* ============ 開頭說明 ============ */
.intro{text-align:center;padding:22px 6px 6px;position:relative}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--ink);color:#fff;font-weight:800;
  padding:6px 16px;border-radius:999px;font-size:15px;letter-spacing:2px;
  transform:rotate(-2deg);
}
.badge i{color:var(--sun);font-style:normal}
.intro h1{
  font-size:clamp(25px,7vw,32px);line-height:1.35;margin:14px 0 8px;font-weight:800;
  text-shadow:0 2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff, 0 -2px 0 #fff;
}
.intro p{margin:0 auto;max-width:25em;font-size:16px;font-weight:600}

/* ============ 卡片 ============ */
.card{
  position:relative;background:var(--cream);border:var(--line);border-radius:var(--radius);
  box-shadow:5px 6px 0 var(--ink);padding:22px 18px 24px;margin-top:22px;
}
.blob{position:absolute;pointer-events:none}
.blob.b1{width:66px;top:-34px;right:14px}
.blob.b2{width:52px;bottom:-22px;left:-10px}

.field{margin-bottom:22px}
.label{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;margin-bottom:9px}
.num{
  flex:none;width:28px;height:28px;border-radius:50%;border:var(--line);
  display:grid;place-items:center;font-size:15px;line-height:1;
}
.n1{background:var(--sun)} .n2{background:var(--pink)} .n3{background:var(--blue)}
.req{color:var(--red);font-size:14px;font-weight:600}
.opt{color:#7a6d5c;font-size:14px;font-weight:600}
.hint{font-size:14px;color:#6c604f;margin:6px 2px 0;font-weight:600}

textarea,input[type=text],input[type=tel],select{
  width:100%;font:inherit;font-size:17px;color:var(--ink);
  background:#fff;border:var(--line);border-radius:16px;padding:12px 14px;
  outline:none;appearance:none;-webkit-appearance:none;
  transition:box-shadow .15s;
}
textarea{min-height:170px;resize:vertical;line-height:1.7}
textarea:focus,input:focus,select:focus{box-shadow:0 0 0 4px var(--sun-soft)}
.count{text-align:right;font-size:13px;color:#8a7c69;margin-top:4px}
.count.over{color:var(--red);font-weight:800}

/* 匿名 / 留名 切換 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  border:var(--line);border-radius:16px;background:#fff;padding:12px 6px;
  font-weight:800;font-size:17px;text-align:center;transition:transform .1s, background .15s;
  -webkit-tap-highlight-color:transparent;
}
.seg label small{font-weight:600;font-size:13px;color:#7a6d5c}
.seg input:checked + label{background:var(--sun);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.seg input:focus-visible + label{box-shadow:0 0 0 4px var(--sun-soft)}
.reveal{margin-top:12px}
[hidden]{display:none!important}

.consent{
  display:flex;gap:10px;align-items:flex-start;margin-top:12px;
  background:#fff;border:2px dashed #c9b48c;border-radius:14px;padding:10px 12px;font-size:15px;font-weight:600;
}
.consent input{width:22px;height:22px;flex:none;margin:2px 0 0;accent-color:var(--teal)}

/* 防機器人欄位，人看不到 */
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ============ 按鈕 ============ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font:inherit;font-weight:800;font-size:20px;letter-spacing:1px;color:var(--ink);
  background:var(--sun);border:var(--line);border-radius:999px;padding:15px 20px;
  box-shadow:4px 5px 0 var(--ink);cursor:pointer;transition:transform .08s, box-shadow .08s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.7;cursor:wait}
.btn.ghost{background:#fff;font-size:17px;padding:12px 18px}
.spin{width:20px;height:20px;border:3px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

.err{
  margin:0 0 16px;background:#FFE3E0;border:2px solid var(--red);border-radius:14px;
  padding:10px 14px;font-weight:600;font-size:15px;
}
.privacy{
  text-align:center;font-size:14px;font-weight:600;margin:22px 8px 0;
  background:rgba(255,251,240,.75);border-radius:14px;padding:10px 12px;
}

/* ============ 送出後 ============ */
.thanks{text-align:center;padding-top:30px}
.thanks h2{font-size:30px;margin:6px 0 6px;font-weight:800}
.thanks .big{font-size:17px;font-weight:600;margin:0 0 16px}
.verse{
  background:#fff;border:2px dashed var(--sun);border-radius:18px;
  padding:14px 16px;margin:18px 0 22px;font-size:16px;line-height:1.8;text-align:left;
}
.verse cite{display:block;text-align:right;font-style:normal;font-size:14px;color:#7a6d5c;margin-top:4px}
.callme{
  display:inline-block;background:var(--teal);color:#fff;font-weight:800;border-radius:999px;
  padding:6px 16px;font-size:15px;margin-bottom:6px;border:2px solid var(--ink)
}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* 閃亮星星 */
.spark{position:absolute;font-style:normal;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(20deg);opacity:.6}}

footer{text-align:center;font-size:13px;font-weight:600;color:#5d4f3a;padding:6px 16px 28px}

.demo{
  position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:9;
  background:var(--navy);color:#fff;font-size:13px;font-weight:800;
  padding:5px 14px;border-radius:999px;border:2px solid #fff;white-space:nowrap;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hero">
  <img src="img/banner.jpg" width="1400" height="539"
       alt="2026 耶YEAH!市集 ReNEW!　12.12–12.13　台塑王氏昆仲公園">
</header>

<main class="wrap">

  <!-- ================= 填寫畫面 ================= -->
  <div id="formView">
    <section class="intro">
      <span class="badge"><i>✦</i> 代禱信箱 <i>✦</i></span>
      <h1>把心裡的事寫下來<br>我們一起為你禱告</h1>
      <p>不管是大事小事、煩惱或感謝，都可以寫。<br>我們的同工會一一為你禱告。</p>
    </section>

    <form class="card" id="f" novalidate>
      <!-- 角落的小怪物（呼應主題圖） -->
      <svg class="blob b1" viewBox="0 0 80 64" aria-hidden="true">
        <path d="M8 40C4 20 22 4 42 6s34 12 32 32-18 24-36 22S11 55 8 40Z" fill="#F48FAA" stroke="#232022" stroke-width="3"/>
        <circle cx="32" cy="30" r="6" fill="#fff" stroke="#232022" stroke-width="2"/><circle cx="33" cy="31" r="2.6" fill="#232022"/>
        <circle cx="50" cy="29" r="6" fill="#fff" stroke="#232022" stroke-width="2"/><circle cx="51" cy="30" r="2.6" fill="#232022"/>
        <path d="M34 43q8 7 16 0" fill="none" stroke="#232022" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <svg class="blob b2" viewBox="0 0 64 60" aria-hidden="true">
        <path d="M6 34C2 16 16 4 32 5s28 12 26 29-14 22-28 21S9 49 6 34Z" fill="#5DAAF0" stroke="#232022" stroke-width="3"/>
        <circle cx="24" cy="28" r="3.2" fill="#232022"/><circle cx="40" cy="28" r="3.2" fill="#232022"/>
        <path d="M27 38q5 4 10 0" fill="none" stroke="#232022" stroke-width="2.6" stroke-linecap="round"/>
      </svg>

      <div class="err" id="err" role="alert" hidden></div>

      <!-- 1 代禱內容 -->
      <div class="field">
        <label class="label" for="content"><span class="num n1">1</span>想請我們為你禱告什麼？<span class="req">必填</span></label>
        <textarea id="content" name="content" maxlength="1000"
          placeholder="例如：家人的健康、工作、考試、關係，或是想感謝的事……"></textarea>
        <div class="count" id="count">0 / 1000</div>
      </div>

      <!-- 2 署名 -->
      <div class="field">
        <div class="label" id="whoLabel"><span class="num n2">2</span>你想怎麼署名？</div>
        <div class="seg" role="radiogroup" aria-labelledby="whoLabel">
          <input type="radio" name="who" id="whoAnon" value="匿名" checked>
          <label for="whoAnon">🙈 匿名<small>不留名字也沒關係</small></label>
          <input type="radio" name="who" id="whoName" value="具名">
          <label for="whoName">😊 留下名字<small>讓我們知道怎麼稱呼你</small></label>
        </div>
        <div class="reveal" id="nameBox" hidden>
          <input type="text" id="name" name="name" maxlength="30" autocomplete="name" placeholder="你的名字或暱稱">
        </div>
      </div>

      <!-- 3 電話 -->
      <div class="field">
        <label class="label" for="phone"><span class="num n3">3</span>留電話給我們<span class="opt">選填</span></label>
        <input type="tel" id="phone" name="phone" maxlength="20" inputmode="tel" autocomplete="tel"
               placeholder="09xx-xxx-xxx">
        <p class="hint">留了電話，我們會找時間打給你、關心你。<br>不想被打擾就空著，一樣會為你禱告。</p>

        <div id="phoneMore" hidden>
          <div class="reveal">
            <select id="when" name="when" aria-label="方便接電話的時間">
              <option value="">什麼時候方便接電話？（可不選）</option>
              <option>平日白天</option>
              <option>平日晚上</option>
              <option>週末</option>
              <option>什麼時候都可以</option>
            </select>
          </div>
          <label class="consent">
            <input type="checkbox" id="agree">
            <span>我同意同工用這支電話聯絡我。電話只用來關心代禱，不會給其他人。</span>
          </label>
        </div>
      </div>

      <!-- 防機器人 -->
      <div class="hp" aria-hidden="true">
        <label>網站<input type="text" id="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <button class="btn" type="submit" id="sendBtn">送出我的代禱 <span aria-hidden="true">✦</span></button>
    </form>

    <p class="privacy">🔒 你寫的內容只有負責代禱的同工看得到，不會公開。</p>
  </div>

  <!-- ================= 送出後 ================= -->
  <section class="card thanks" id="thanksView" hidden tabindex="-1">
    <i class="spark" style="top:14px;left:22px;color:var(--sun);font-size:26px">✦</i>
    <i class="spark" style="top:40px;right:26px;color:var(--pink);font-size:20px;animation-delay:.6s">✦</i>
    <i class="spark" style="top:90px;left:40px;color:var(--blue);font-size:16px;animation-delay:1.2s">✦</i>
    <svg class="pop" width="96" viewBox="0 0 80 64" aria-hidden="true">
      <path d="M8 40C4 20 22 4 42 6s34 12 32 32-18 24-36 22S11 55 8 40Z" fill="#F6B417" stroke="#232022" stroke-width="3"/>
      <path d="M26 30q5-6 10 0M46 30q5-6 10 0" fill="none" stroke="#232022" stroke-width="3" stroke-linecap="round"/>
      <path d="M32 41q9 9 18 0" fill="#E8463C" stroke="#232022" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="24" cy="39" r="4" fill="#F48FAA"/><circle cx="58" cy="39" r="4" fill="#F48FAA"/>
    </svg>
    <h2 class="pop">收到了！</h2>
    <p class="big" id="thanksMsg">謝謝你願意分享，<br>我們會為你禱告。</p>
    <div id="callNote" hidden><span class="callme">📞 我們會找時間打給你</span></div>

    <blockquote class="verse">
      應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。神所賜出人意外的平安，必在基督耶穌裡保守你們的心懷意念。
      <cite>— 腓立比書 4:6–7</cite>
    </blockquote>

    <button class="btn ghost" type="button" id="againBtn">再寫一則代禱</button>
  </section>
</main>

<footer>耶YEAH!市集 ReNEW! · 代禱信箱</footer>

<script>
/* ============================================================
   ★ 部署後只要改這一行：貼上 Apps Script「網頁應用程式」的網址
   （留空 = 測試模式，不會真的送出）
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwnrxzjmwGL_SfyCi9uZ4qXnLU8IR9P5Uh6bpDqd8armJrhIzAU9uaDDyHOLAiqQeLQ/exec';

const $ = id => document.getElementById(id);
const f = $('f'), content = $('content'), count = $('count'), phone = $('phone');
const sendBtn = $('sendBtn'), errBox = $('err');

if (!API_URL) {
  const d = document.createElement('div');
  d.className = 'demo'; d.textContent = '測試模式：還沒接上試算表';
  document.body.appendChild(d);
}

/* 字數 */
function updateCount(){
  const n = content.value.length;
  count.textContent = n + ' / 1000';
  count.classList.toggle('over', n >= 1000);
}
content.addEventListener('input', updateCount);

/* 匿名 / 留名 */
document.querySelectorAll('input[name=who]').forEach(r => r.addEventListener('change', () => {
  const named = $('whoName').checked;
  $('nameBox').hidden = !named;
  if (named) setTimeout(() => $('name').focus(), 50);
}));

/* 有填電話才出現時段與同意 */
phone.addEventListener('input', () => {
  phone.value = phone.value.replace(/[^\d+\-\s()#]/g, '');
  $('phoneMore').hidden = phone.value.trim() === '';
});

function showErr(msg, focusEl){
  errBox.textContent = msg; errBox.hidden = false;
  errBox.scrollIntoView({behavior:'smooth', block:'center'});
  if (focusEl) setTimeout(() => focusEl.focus({preventScroll:true}), 350);
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  errBox.hidden = true;

  const text = content.value.trim();
  const named = $('whoName').checked;
  const name = $('name').value.trim();
  const tel = phone.value.trim();
  const digits = tel.replace(/\D/g, '');

  if (!text) return showErr('請先寫下想請我們代禱的事 🙏', content);
  if (named && !name) return showErr('選了「留下名字」，請寫一下怎麼稱呼你（或改選匿名）', $('name'));
  if (tel && (digits.length < 8 || digits.length > 15)) return showErr('電話好像少了幾碼，請再確認一下', phone);
  if (tel && !$('agree').checked) return showErr('留電話的話，請勾選同意我們聯絡你（不想被聯絡就把電話清空）', $('agree'));

  const payload = {
    content: text,
    who: named ? '具名' : '匿名',
    name: named ? name : '',
    phone: tel,
    when: tel ? $('when').value : '',
    website: $('website').value   // 機器人才會填
  };

  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spin"></span> 送出中…';

  try {
    if (API_URL) {
      const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.msg || '送出失敗');
    } else {
      console.log('[測試模式] 會送出：', payload);
      await new Promise(r => setTimeout(r, 700));
    }
    showThanks(named ? name : '', !!tel);
  } catch (err) {
    showErr((err && err.message && err.message !== 'Failed to fetch' ? err.message : '網路好像不太穩，')
      + '　請再按一次「送出」，你寫的內容都還在。');
  } finally {
    sendBtn.disabled = false;
    sendBtn.innerHTML = '送出我的代禱 <span aria-hidden="true">✦</span>';
  }
});

function showThanks(name, willCall){
  $('formView').hidden = true;
  $('thanksView').hidden = false;
  $('thanksMsg').innerHTML = (name ? escapeHtml(name) + '，' : '') + '謝謝你願意分享，<br>我們會為你禱告。';
  $('callNote').hidden = !willCall;
  window.scrollTo({top:0, behavior:'smooth'});
  $('thanksView').focus({preventScroll:true});
}

$('againBtn').addEventListener('click', () => {
  f.reset(); updateCount();
  $('nameBox').hidden = true; $('phoneMore').hidden = true;
  $('thanksView').hidden = true; $('formView').hidden = false;
  window.scrollTo({top:0, behavior:'smooth'});
});

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
